name: Nightly billing reconcile

# Keeps each customer's Stripe subscription in step with their venues, and flags fair-use and cancelled
# accounts to Slack. It calls the app's reconcile endpoint, which needs the same CRON_SECRET the app has.
# Setup: GitHub repo, Settings, Secrets and variables, Actions, New repository secret: CRON_SECRET.

on:
  schedule:
    - cron: '17 3 * * *'   # every night at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reconcile subscriptions with venues
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The CRON_SECRET repository secret is not set"; exit 1; fi
          # Retry a few times: a one-off network blip (curl error 56, "connection reset") should not fail the night.
          # The job still fails, and GitHub emails you, if the app keeps answering with anything but 200. The reply is printed either way.
          code=$(curl -sS -m 120 --retry 4 --retry-all-errors --retry-delay 30 -A "stacked-chat-cron/1.0 (GitHub Actions)" \
            -o response.txt -w '%{http_code}' -X POST -H "x-cron-secret: $CRON_SECRET" https://stackedchat.io/api/v1/internal/billing/reconcile) || { echo "Could not reach the app (curl exit $?)"; exit 1; }
          echo "HTTP $code"
          cat response.txt; echo
          [ "$code" = "200" ]
