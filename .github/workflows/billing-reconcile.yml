name: Nightly billing reconcile

# Keeps each customer's Stripe subscription in step with their venues, and flags fair-use and cancelled
# accounts to Slack. It calls the app's reconcile endpoint, which needs the same CRON_SECRET the app has.
# Setup: GitHub repo, Settings, Secrets and variables, Actions, New repository secret: CRON_SECRET.

on:
  schedule:
    - cron: '17 3 * * *'   # every night at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile subscriptions with venues
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "The CRON_SECRET repository secret is not set"; exit 1; fi
          # -f makes the job fail (and GitHub email you) if the app answers with an error
          curl -fsS -m 120 -X POST -H "x-cron-secret: $CRON_SECRET" https://stackedchat.io/api/v1/internal/billing/reconcile
          echo
